  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);

  header { max-width:1200px; margin:0 auto; padding:34px 0 6px; text-align:center }

    background:linear-gradient(90deg,transparent,#e0af68,transparent) }
  nav { max-width:1200px; margin:0 auto 22px; text-align:center }
  .chips { margin:7px 0 }
  .chip { background:var(--panel); color:var(--dim); border:1px solid var(--edge);
    border-radius:999px; padding:6px 15px; margin:3px; cursor:pointer;
    font:700 12px/1 Verdana, sans-serif; letter-spacing:1.5px }
  .chip.on { color:var(--ink); border-color:#e0af68; background:#2a2417 }
  .count { color:var(--dim); font-size:13px; letter-spacing:2px; margin-top:6px }
  main { max-width:1200px; margin:0 auto; columns:3 340px; column-gap:18px }
  .card { break-inside:avoid; margin:0 0 18px; background:var(--panel);
    border:1px solid var(--edge); border-radius:12px; overflow:hidden }
  .card.hide { display:none }
  .card img { display:block; width:100%; height:auto; cursor:zoom-in }
  figcaption { padding:8px 14px 11px; display:flex; align-items:baseline;
    justify-content:space-between; gap:10px }
  figcaption b { font-size:16px }
  .meta { color:var(--dim); font:400 11px/1 Verdana, sans-serif;
    letter-spacing:1px; white-space:nowrap }
  #zoom { position:fixed; inset:0; background:rgba(5,6,9,.93); display:none;
    align-items:flex-start; justify-content:center; overflow:auto; padding:26px;
    cursor:zoom-out; z-index:9 }
  #zoom img { max-width:min(1120px,96vw); height:auto; border-radius:10px }
  footer { text-align:center; color:var(--dim); font-size:12px; letter-spacing:2px;
    margin-top:40px }
  footer a { color:var(--walking) }
</style>

<script>
  var sel = { tax:"", level:"", role:"" };
  var cards = [].slice.call(document.querySelectorAll(".card"));
  function apply() {
    var n = 0;
    cards.forEach(function (c) {
      var ok = (!sel.tax || c.dataset.tax === sel.tax) &&
               (!sel.level || c.dataset.level === sel.level) &&
               (!sel.role || c.dataset.role === sel.role);
      c.classList.toggle("hide", !ok);
      if (ok) n++;
    });
    document.getElementById("count").textContent = "SHOWING " + n + " OF " + cards.length;
  }
  document.querySelectorAll(".chip").forEach(function (b) {
    b.onclick = function () {
      sel[b.dataset.k] = b.dataset.v;
      b.parentNode.querySelectorAll(".chip").forEach(function (o) {
        o.classList.toggle("on", o === b);
      });
      apply();
    };
  });
  var zoom = document.getElementById("zoom");
  document.getElementById("grid").addEventListener("click", function (e) {
    if (e.target.tagName !== "IMG") return;
    zoom.firstElementChild.src = e.target.src;
    zoom.style.display = "flex";
  });
  zoom.onclick = function () { zoom.style.display = "none"; };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") zoom.style.display = "none";
  });
  apply();
</script>
