<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>robotoarena</title>
    <link rel="icon" href="data:," />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #060504;
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            font-family: "Courier New", monospace;
        }
        #render { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
        #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        #vignette {
            position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.5) 100%);
        }
        #flash { position: absolute; inset: 0; pointer-events: none; background: #d90d0d; opacity: 0; }

        .bubble {
            position: absolute; transform: translateX(-50%);
            background: rgba(10, 10, 16, 0.85);
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 19px; font-weight: bold; letter-spacing: 3px;
            color: #fff; white-space: nowrap; pointer-events: none;
        }
        .bubble.hot { font-size: 25px; border-color: rgba(150,200,255,0.8); }
        .bubble.danger {
            border-color: rgba(255, 70, 60, 0.95);
            box-shadow: 0 0 12px rgba(255, 60, 40, 0.55);
            animation: dangerpulse 0.5s infinite;
        }
        @keyframes dangerpulse { 50% { box-shadow: 0 0 4px rgba(255, 60, 40, 0.25); } }
        .bubble.err { background: rgba(120, 16, 16, 0.92); }
        .bubble.gold { border-color: rgba(255,206,84,0.9); color: #ffd75e; }
        .bubble.long {
            font-size: 14px; letter-spacing: 1px; line-height: 1.6;
            white-space: normal; max-width: 88vw; text-align: center;
        }
        .bubble .done { color: #57e657; }
        .mcol {
            display: inline-flex; flex-direction: column; align-items: center;
            margin: 0 2px; line-height: 1.15;
        }
        .mc { font-size: 12px; letter-spacing: 1px; color: #b7dcff; }
        .bubble .mc.done { color: #3fae3f; }
        .bubble .mc.next { color: #ffd75e; }
        .bubble.morse { letter-spacing: 0; }
        .bubble.morse.long { white-space: normal; max-width: 92vw; }
        .bubble .next { color: #ffe94d; }
        .bubble .pips {
            display: block; text-align: center;
            font-size: 12px; letter-spacing: 4px; color: #c76be0;
        }

        #hud { position: absolute; top: 10px; left: 12px; right: 12px; color: #fff; pointer-events: none; }
        #count { font-size: 19px; font-weight: bold; text-shadow: 0 1px 3px #000; }
        #hpwrap {
            margin-top: 6px; width: 150px; height: 13px;
            background: rgba(20,20,26,0.85); border: 2px solid rgba(255,255,255,0.4);
        }
        #hpfill { height: 100%; width: 100%; background: #3fcc3f; }
        #hptext { display: inline-block; margin-left: 6px; font-size: 13px; vertical-align: top; }
        #chain { margin-top: 4px; font-size: 14px; color: #ffe94d; text-shadow: 0 1px 3px #000; min-height: 16px; }
        #scorehud { margin-top: 2px; font-size: 14px; color: #e8c86a; text-shadow: 0 1px 3px #000; min-height: 16px; }
        #superwrap {
            margin-top: 4px; width: 150px; height: 9px; display: inline-block;
            background: rgba(20,20,26,0.85); border: 2px solid rgba(255,214,94,0.35);
        }
        #superlabel {
            display: block; margin-top: 2px; width: 154px;
            font-size: 10px; text-align: center;
            letter-spacing: 2px; color: #d8b662;
            text-shadow: 0 1px 3px #000;
        }
        #superlabel.full { color: #ffd75e; animation: pulse 0.8s infinite; }
        #superfill { height: 100%; width: 0%; background: #b8912e; }
        #superwrap.full { border-color: #ffd75e; box-shadow: 0 0 10px #ffd75e88; }
        #superwrap.full #superfill { background: #ffd75e; }
        #banish {
            position: absolute; left: 50%; top: 13%; transform: translateX(-50%);
            display: none; padding: 6px 14px; border-radius: 8px;
            background: rgba(30, 24, 6, 0.9); border: 2px solid #ffd75e;
            box-shadow: 0 0 18px #ffd75e99;
            font-size: 21px; font-weight: bold; letter-spacing: 5px; color: #ffd75e;
            animation: banishflash 0.8s infinite; z-index: 12; pointer-events: none;
        }
        #banish.on { display: block; }
        #banish .done { color: #fff; }
        @keyframes banishflash { 50% { box-shadow: 0 0 5px #ffd75e44; opacity: 0.75; } }
        #room { position: absolute; top: 0; right: 0; font-size: 17px; opacity: 0.75; text-shadow: 0 1px 3px #000; }
        #version { position: absolute; top: 22px; right: 0; font-size: 12px; opacity: 0.5; }
        #mute {
            position: absolute; top: 44px; right: 0; cursor: pointer;
            pointer-events: auto; touch-action: none;
            background: rgba(30,30,42,0.8); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px; color: #fff; font-size: 20px; padding: 4px 10px;
        }
        #kbtoggle {
            position: absolute; top: 90px; right: 0; display: none;
            pointer-events: auto; touch-action: none;
            background: rgba(30,30,42,0.8); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px; color: #fff; font-size: 20px; padding: 4px 10px;
        }
        #hw {
            position: absolute; left: 50%; bottom: 45%;
            width: 2px; height: 2px; opacity: 0.01;
            border: none; outline: none; background: transparent;
            caret-color: transparent; color: transparent;
        }
        #menu {
            position: absolute; inset: 0; z-index: 28;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(4, 3, 2, 0.78);
        }
        #menu.off { display: none; }
        #menutitle {
            font-size: 24px; font-weight: bold; letter-spacing: 6px;
            color: #e8d9a0; text-shadow: 0 2px 8px #000; text-align: center;
        }
        /* bounded so the chips actually WRAP on narrow screens instead
           of running off both edges */
        #menuword {
            margin-top: 26px; display: flex; gap: 18px; flex-wrap: wrap;
            justify-content: center; max-width: min(94vw, 900px);
        }
        .menuopt {
            padding: 10px 26px;
            background: rgba(10, 10, 16, 0.9);
            border: 2px solid rgba(255, 214, 94, 0.8); border-radius: 8px;
            box-shadow: 0 0 18px #ffd75e55;
            font-size: 34px; font-weight: bold; letter-spacing: 8px; color: #fff;
        }
        /* typed-progress letters light up wherever a menuopt chip lives
           (the input-mode menu AND the death-screen choices) */
        .menuopt .done { color: #57e657; }
        .menuopt .next { color: #ffe94d; }
        #menuhint {
            margin-top: 22px; font-size: 14px; letter-spacing: 2px;
            color: #b9a97e; opacity: 0.85; animation: pulse 1.4s infinite;
            text-align: center;
        }
        #menubest {
            margin-top: 30px; font-size: 13px; letter-spacing: 2px;
            color: #8fae8f; text-shadow: 0 1px 3px #000; text-align: center;
            line-height: 1.7;
        }
        #menubest:empty { display: none; }
        /* phones: smaller chips, tighter spacing, and room above the
           on-screen keyboard */
        @media (max-width: 640px) {
            #menu { justify-content: flex-start; padding-top: 16vh; }
            #menutitle { font-size: 17px; letter-spacing: 3px; padding: 0 10px; }
            #menuword { gap: 10px; margin-top: 18px; }
            .menuopt { font-size: 21px; letter-spacing: 4px; padding: 7px 12px; }
            #menuhint { margin-top: 14px; font-size: 12px; }
            #menubest { margin-top: 16px; font-size: 11px; }
        }
        #intro {
            position: absolute; top: 26%; left: 0; right: 0; text-align: center;
            color: #ffe94d; font-size: 22px; font-weight: bold; text-shadow: 0 2px 4px #000;
            pointer-events: none;
        }

        #overlay {
            position: absolute; inset: 0; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            /* below the morse panel (20) and keyboard (29) so the
               typed CONTINUE / RESTART choice stays enterable */
            color: #fff; text-align: center; z-index: 18;
        }
        #overlay.show { display: flex; }
        #overlay.dead { background: rgba(50, 0, 0, 0.6); }
        #overlay.win { background: rgba(0, 0, 0, 0.55); }
        #ovtitle { font-size: 30px; font-weight: bold; text-shadow: 0 2px 6px #000; }
        #ovtally { margin-top: 14px; font-size: 19px; opacity: 0.9; line-height: 1.7; }
        #ovrank { display: inline-block; margin-top: 10px; font-size: 34px; color: #ffd75e; text-shadow: 0 2px 6px #000; }
        #ovprompt { margin-top: 26px; font-size: 20px; opacity: 0; animation: pulse 1.2s infinite; }
        #ovchoices { margin-top: 24px; display: none; gap: 18px; flex-wrap: wrap; justify-content: center; }
        #ovchoices.show { display: flex; }
        #ovchoices .menuopt { font-size: 26px; letter-spacing: 6px; }
        #ovchapter { margin-top: 12px; font-size: 14px; letter-spacing: 2px; color: #b9a97e; }
        #banner {
            position: absolute; left: 0; right: 0; top: 38%;
            padding: 26px 0; text-align: center;
            font-size: 34px; font-weight: bold; letter-spacing: 10px;
            color: #e8d9a0; text-shadow: 0 2px 10px #000;
            background: linear-gradient(to bottom, transparent,
                rgba(0,0,0,0.75) 25%, rgba(0,0,0,0.75) 75%, transparent);
            opacity: 0; pointer-events: none; z-index: 25;
        }
        #ovprompt.ready { opacity: 1; }
        @keyframes pulse { 50% { opacity: 0.4; } }

        #morse {
            position: absolute; left: 0; right: 0; bottom: 0; display: none;
            background: rgba(16, 16, 24, 0.92);
            padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
            z-index: 30;
        }
        #morsetape {
            text-align: center; color: #ffe94d; font-size: 22px;
            letter-spacing: 6px; min-height: 26px; font-weight: bold;
            text-shadow: 0 1px 3px #000;
        }
        #morsetape .dim { opacity: 0.5; color: #fff; }
        #morserow { display: flex; gap: 10px; margin-top: 8px; }
        .mkey {
            flex: 1; height: 104px;
            background: #333648; border: 1px solid rgba(255,255,255,0.16);
            border-radius: 10px; color: #fff; font-size: 56px; font-weight: bold;
            font-family: inherit; touch-action: none;
        }
        .mkey.hit { background: #7381a8; }
        #morsespacerow { display: flex; justify-content: center; margin-top: 8px; }
        #morsespace {
            flex: 0 1 70%; height: 46px; max-width: 460px;
            background: #333648; border: 1px solid rgba(255,255,255,0.16);
            border-radius: 10px; color: #fff; font-size: 15px; letter-spacing: 4px;
            font-family: inherit; touch-action: none;
        }
        #morsespace.hit { background: #7381a8; }

        #keyboard {
            position: absolute; left: 0; right: 0; bottom: 0;
            background: rgba(16, 16, 24, 0.92);
            padding: 5px 3px calc(6px + env(safe-area-inset-bottom));
            /* above the input-mode menu overlay (28) so the keys stay
               tappable while choosing a mode */
            z-index: 29;
        }
        .krow { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
        .key {
            flex: 0 1 9.2%; max-width: 58px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            background: #333648; border: 1px solid rgba(255,255,255,0.16); border-radius: 5px;
            color: #fff; font-size: 21px; font-weight: bold; font-family: inherit;
            touch-action: none;
        }
        .key.hit { background: #7381a8; }
        .key.space { flex: 0 1 46%; max-width: 300px; height: 40px; font-size: 14px; letter-spacing: 3px; }
    </style>
</head>
<body>
    <canvas id="render"></canvas>
    <canvas id="fx"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div id="bubbles"></div>
    <div id="hud">
        <div id="count"></div>
        <div><div id="hpwrap"><div id="hpfill"></div></div><span id="hptext">HP 100</span></div>
        <div><div id="superwrap"><div id="superfill"></div></div><span id="superlabel"></span></div>
        <div id="chain"></div>
        <div id="scorehud"></div>
        <div id="room"></div>
        <div id="version"></div>
        <button id="mute" title="Toggle sound">🔊</button>
        <button id="kbtoggle" title="Toggle keyboard">⌨</button>
    </div>
    <input id="hw" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" tabindex="-1" />
    <div id="intro"></div>
    <div id="banner"></div>
    <div id="menu">
        <div id="menutitle"></div>
        <div id="menuword"></div>
        <div id="menuhint"></div>
        <div id="menubest"></div>
    </div>
    <div id="banish"></div>
    <div id="overlay">
        <div id="ovtitle"></div>
        <div id="ovtally"></div>
        <div id="ovprompt"></div>
        <div id="ovchoices"></div>
        <div id="ovchapter"></div>
    </div>
    <div id="morse">
        <div id="morsetape"></div>
        <div id="morserow">
            <button id="dotbtn" class="mkey">&#9679;</button>
            <button id="dashbtn" class="mkey">&#9472;</button>
        </div>
        <div id="morsespacerow"><button id="morsespace">SPACE</button></div>
    </div>
    <div id="keyboard"></div>
    <audio id="music" loop preload="auto"></audio>
    <script src="game.js?v=d805969c7d440338fda2f59acc0bad4b58b03a52"></script>
</body>
</html>
